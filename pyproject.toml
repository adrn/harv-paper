[project]
name = "harv-paper"
version = "0.1.0"
license = "MIT"
license-files = [
    "licenses/LICENSE",
    "licenses/LICENSE-NONCODE",
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "blackjax>=1.7.1",
    "harv",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "numpyro>=0.22.0",
    "scipy>=1.18.1",
    "thejoker==1.3.1",
]

[dependency-groups]
dev = [
  "ruff",
]

test = [
  "pytest",
]

# CUDA-enabled jaxlib for the GPU benchmarks (Linux only): uv sync --group cuda
cuda = [
  "jax[cuda13]>=0.11,<0.12; sys_platform == 'linux'",
]

docs = [
]

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# [tool.hatch.metadata]
# allow-direct-references = true

# [tool.hatch.build.targets.wheel]
# packages = ["src/TODO"]

[tool.ruff]
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E741"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
harv = { git = "https://github.com/adrn/harv.git" }
